[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rwrme-map-cli"
version = "1.0.0"
description = "Agent-friendly standalone map CLI matching rwrme's SVG and terrain workflow"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.4,<13", "numpy>=1.26,<3"]

[project.scripts]
rwrmap = "rwrmap.__main__:main"

[tool.setuptools]
packages = ["rwrmap"]
